name: Version Packages

# On every push to the release branch, roll all pending changesets into a
# "Version Packages" PR that bumps versions + writes changelogs. Merging that
# PR is what bumps the versions on v2; the actual npm publish is then done by
# NPM Package Deploy after CI passes. This workflow never publishes.

on:
  push:
    branches: [v2]

concurrency: version-packages-${{ github.ref }}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 24 }
      - run: corepack enable && yarn install --immutable
      - uses: changesets/action@v1
        with:
          version: yarn version-packages
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
