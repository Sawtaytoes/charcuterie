name: Version Packages

# On every push to the release branch, roll all pending changesets into a
# "Version Packages" PR that bumps versions + writes changelogs. Merging that
# PR is what bumps the versions on v2; the actual npm publish is then done by
# NPM Package Deploy after CI passes. This workflow never publishes.

on:
  push:
    branches: [master]

concurrency: version-packages-${{ github.ref }}

# Turborepo sends anonymous usage telemetry to Vercel unless one of these is set.
# Keep both on every workflow that runs `pnpm build` (decision:
# 2026-11-22-turborepo-telemetry-stays-off-and-turbo-writes-no-agent-guidance).
env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 26 }
      - name: Install the pinned native pnpm CLI
        run: |
          npm install --global --force --allow-scripts=pnpm pnpm@12.9.1
          pnpm_bin="$(npm prefix --global)/bin"
          export PATH="$pnpm_bin:$PATH"
          echo "$pnpm_bin" >> "$GITHUB_PATH"
          hash -r
          test "$(pnpm --version)" = 12.9.1
      - run: pnpm install --frozen-lockfile --store-dir "$HOME/.cache/pnpm/store"
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
