name: Docker base image

# Builds ghcr.io/sawtaytoes/charcuterie-node-base for each supported Node
# major. Builds on PRs (no push) so the image is verified before merge —
# the build IS the verification — and builds + pushes on master.
on:
  push:
    branches: [master]
    paths:
      - "docker/node-base/**"
      - ".github/workflows/docker-base-image.yml"
  pull_request:
    paths:
      - "docker/node-base/**"
      - ".github/workflows/docker-base-image.yml"
  workflow_dispatch:

concurrency:
  group: charcuterie-docker-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event.pull_request.number != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        node_major: [24, 26]
    # Retain every main/manual publication, serialized per Node-major tag.
    # PR verification is canceled by the workflow's separate PR group.
    concurrency:
      group: charcuterie-image-${{ matrix.node_major }}-${{ github.event.pull_request.number && github.run_id || 'publish' }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      # Only authenticate when we intend to push (never on a PR from a fork
      # or otherwise). PR builds verify the image builds without publishing.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on master)
        uses: docker/build-push-action@v6
        with:
          context: docker/node-base
          file: docker/node-base/Dockerfile
          build-args: NODE_MAJOR=${{ matrix.node_major }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/sawtaytoes/charcuterie-node-base:${{ matrix.node_major }}
          # cache-from/to keeps rebuilds cheap; layers live in the registry.
          cache-from: type=gha
          cache-to: type=gha,mode=max
