name: NPM Package Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [master]
    types: [completed]
  # Publishing is idempotent (a package publishes only when no `<pkg>-v<version>`
  # tag exists yet), so a manual re-run is safe and is how a half-failed release
  # is retried without an empty commit.
  workflow_dispatch:

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # OIDC trusted publishing + provenance; no npm token secret.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never cache in release builds
      - run: corepack enable
      - run: yarn install --immutable
      # dist is generated, not committed — build the whole graph topologically
      # so every package's dist and its siblings' dist exist before publish.
      - run: yarn build

      # Publish each public package only when its version was bumped this push —
      # i.e. when no `<pkg>-v<version>` tag exists yet. Bumping is done by merging
      # the Version Packages PR; CI never edits package.json. On a real publish we
      # push the lightweight tag so later runs skip cleanly (idempotent). Order is
      # topological: tokens and logic before ui, which depends on both.
      #
      # `yarn pack` (not `npm pack`) builds the tarball because only yarn rewrites
      # the `workspace:*` deps — @charcuterie/ui's dependency on logic + tokens —
      # into real version ranges. npm publishes that tarball, which is what carries
      # OIDC trusted publishing + provenance. Verified: npm pack leaves
      # `workspace:*` verbatim; yarn pack rewrites it to the sibling's version.
      - name: Publish bumped packages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # storybook-config last: it depends on tokens, and its FIRST
          # publish (0.1.0) is done by hand — OIDC trusted publishing cannot be
          # configured for a package that does not exist yet. See
          # packages/storybook-config/SEEDING.md. Once 0.1.0 is seeded and its
          # `storybook-config-v0.1.0` tag pushed, this loop skips it until a
          # changeset bumps the version, and by then OIDC must be set up.
          for pkg in tokens logic ui eslint-config biome-config storybook-config; do
            dir="packages/$pkg"
            name="$(node -p "require('./$dir/package.json').name")"
            version="$(node -p "require('./$dir/package.json').version")"
            tag="${pkg}-v${version}"

            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "· ${name}@${version} already released (${tag}) — skipping."
              continue
            fi

            echo "→ publishing ${name}@${version}"
            tarball="$(mktemp -d)/${pkg}.tgz"
            yarn workspace "$name" pack -o "$tarball"

            # Unpack yarn's tarball and publish the resulting DIRECTORY.
            #
            # Handed a `.tgz` path, npm does not run its OIDC trusted-publishing
            # exchange — it goes straight to the configured credentials, which in
            # Actions is setup-node's placeholder `_authToken`
            # (XXXXX-XXXXX-XXXXX-XXXXX), so the PUT comes back **404**: npm's mask
            # for an auth failure on a package that does exist. Publishing a
            # directory is what mux-magic does, and it is the only difference
            # between its working OIDC publish and this one.
            #
            # yarn's pack is still what rewrites @charcuterie/ui's `workspace:*`
            # deps into real ranges (npm pack leaves them verbatim), so the
            # tarball stays — only the thing handed to `npm publish` changes.
            # An npm tarball always has a single top-level `package/`.
            # `--ignore-scripts` because every package has `prepack: yarn build`,
            # which yarn already ran while packing — the built `dist` is in the
            # tarball. Re-running it here fails anyway (`tsconfig.build.json` is
            # a repo file, not a published one), and re-building a tarball that
            # was already assembled is exactly what we do not want at publish.
            staged="$(mktemp -d)"
            tar -xzf "$tarball" -C "$staged"
            # On failure, dump npm's debug log. It records at verbose level even
            # when the console does not, and it is the only place the OIDC
            # token-exchange result appears — a trusted-publishing failure is
            # otherwise indistinguishable from a missing package, because npm
            # falls back to the placeholder `_authToken` and the PUT returns a
            # bare 404. Grep it for `verbose oidc`.
            if ! ( cd "$staged/package" && npm publish --provenance --access public --ignore-scripts ); then
              echo "::group::npm debug log"
              tail -n 300 "$(ls -t "${HOME}"/.npm/_logs/*-debug-0.log | head -1)" || true
              echo "::endgroup::"
              exit 1
            fi

            git tag "$tag"
            git push origin "$tag"
            echo "✓ published and tagged ${tag}"
          done
