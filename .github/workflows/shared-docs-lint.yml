# Shared across the fleet — this file is IMPORTED, not copied.
#
# The gate that a docs-only pull request DOES run. Every repo here keeps its
# paper trail in `docs/decisions/`, the shape is written down in AGENTS.md, and
# it was followed by hand — so it drifted. This checks the shape.
#
#   # a GitHub repo
#   docs:
#     uses: Sawtaytoes/charcuterie/.github/workflows/shared-docs-lint.yml@workflows-v1
#
#   # a Forgejo repo — same path on the public pull mirror, and it must ALSO
#   # point the checkout at the mirror, because the linter is run from source.
#   docs:
#     uses: sawtaytoes/charcuterie/.github/workflows/shared-docs-lint.yml@workflows-v1
#     with:
#       charcuterieRepository: sawtaytoes/charcuterie
#
# ⚠️ The linter runs FROM A CHECKOUT, not from npm. `@charcuterie/ci` is not
# published: npm will not let you configure a trusted publisher for a package
# that does not exist yet, so a first publish means a hand-published automation
# token plus a web-UI step, and forgetting the web-UI step breaks the release
# job for every package in the fleet (packages/server/SEEDING.md). Running from
# source removes all of that, and it removes a version-skew axis too — the tag
# in `uses:` and the linter it runs are the same commit.
#
# ⚠️ The inner job is `decisionRecords`, not `lint`. Forgejo posts a status
# context for the INNER job name as well as the caller's, and five repos here
# already have a job called `lint` — two contexts with one name is a branch
# protection that cannot be satisfied.
name: Shared — decision-record lint

on:
  workflow_call:
    inputs:
      charcuterieRepository:
        description: >-
          Where to read the linter from. A Forgejo caller MUST set this to the
          mirror: `actions/checkout` resolves a bare `owner/repo` against the
          runner's own host, so the GitHub default would not exist there.
        type: string
        required: false
        default: Sawtaytoes/charcuterie
      charcuterieRef:
        description: "Pin the linter. Keep this equal to the ref in `uses:`."
        type: string
        required: false
        default: workflows-v1

jobs:
  decisionRecords:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        # The full history: the lint below diffs against the base commit.
        with: { fetch-depth: 0 }

      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.charcuterieRepository || 'Sawtaytoes/charcuterie' }}
          ref: ${{ inputs.charcuterieRef || 'workflows-v1' }}
          path: .charcuterie-lint
          # The linter has no dependencies beyond Node's standard library, so
          # one commit is enough — no install, no lockfile, no build.
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with: { node-version: "24" }

      - id: base
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          # Fails SAFE in the OPPOSITE direction from the docs-only detector.
          # If we cannot work out what changed, lint NOTHING. Roughly a quarter
          # of the fleet's 1050 existing records predate the header convention,
          # and a linter that fails on settled history would either be switched
          # off or force a rewrite of records that are not supposed to be
          # edited after the fact.
          if [ -z "${BASE_SHA:-}" ] \
            || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null
          then
            echo "No usable base commit — nothing to lint."
            echo "baseSha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "baseSha=${BASE_SHA}" >> "$GITHUB_OUTPUT"

      - if: ${{ steps.base.outputs.baseSha != '' }}
        env:
          BASE_SHA: ${{ steps.base.outputs.baseSha }}
        run: |
          set -euo pipefail
          node .charcuterie-lint/packages/ci/src/cli/docsLint.js --base "${BASE_SHA}"
